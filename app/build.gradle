plugins { id 'com.android.application' }

android {
    namespace 'com.khammenha.game'
    compileSdk 34
    defaultConfig {
        applicationId "com.khammenha.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            // يستخدم مفتاح التصحيح ليكون ملف APK قابلاً للتثبيت مباشرة
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
