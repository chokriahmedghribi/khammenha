name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk Khammenha.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Khammenha-apk
          path: Khammenha.apk
      - name: نشر ملف APK كإصدار
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Khammenha.apk --title "خمّنها - آخر إصدار" --notes "حمّل Khammenha.apk وثبّته على هاتفك."
